# All tunable experiment parameters live here. Secrets live in .env, not here.

run:
  steps: 10
  candidates: 3            # candidates per step, one fixed intensity
  base_seed: 1000          # candidate k at step t uses base_seed + t*100 + k

models:
  reader: claude-sonnet-5-5          # vision: readings, hypothesis, operation, judging
  image_editor: flux-3-image-klein   # BFL endpoint /v1/flux-3-image-klein

image:
  max_edge: 1024           # input is downscaled to this before editing
  output_format: png

# Selection gates (0-1). Candidates failing a gate are rejected before ranking.
# Starting guesses; calibrate after the first runs and record changes in git.
gates:
  legibility_floor: 0.4      # was the undo visibly performed
  inheritance_floor: 0.5     # does structure from the input survive
  anchor_floor: 0.3          # inheritance vs the original image_0
  displacement_min: 0.05     # reading distribution must move at least this much
  no_repeat_window: 2        # don't match the reading distribution of the last N steps
  max_same_op_in_row: 2

score_weights:
  legibility: 1.0
  inheritance: 1.0
  displacement: 1.0
