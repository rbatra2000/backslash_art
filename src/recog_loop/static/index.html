<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>before_recognition</title>
<style>
:root{--bg:#f3f0e8;--ink:#1a1917;--mute:#7b766b;--line:#1a1917;--soft:#d9d4c7;--accent:#d4571c;--ok:#2d7a4a;--bad:#c23a2b;--glow:#ef8e4633}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--ink:#e8e4da;--mute:#8d887c;--line:#e8e4da;--soft:#34322d;--accent:#ef8e46;--ok:#7cc79a;--bad:#ee6a5a;--glow:#ef8e4622}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:13px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  background:radial-gradient(circle at 12% -10%,var(--glow),transparent 45%),radial-gradient(circle at 100% 40%,#422abf14,transparent 40%),var(--bg);background-attachment:fixed}
header{position:sticky;top:0;z-index:5;padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;background:linear-gradient(var(--bg) 70%,transparent)}
h1{font-size:13px;margin:0 12px 0 0;font-weight:700;letter-spacing:.02em}
select,input,button{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--mute);border-radius:0;padding:1px 2px;outline:0}
select{max-width:210px}
input[type=number]{width:3.2ch;text-align:center}
button{cursor:pointer;border:0;padding:0;color:var(--accent)}
button::before{content:"[ "}button::after{content:" ]"}
button:hover{text-decoration:underline}
#status{margin-left:auto;color:var(--mute)}
#status::before{content:"[ "}#status::after{content:" ]"}
#status.live{color:var(--accent)}
main{max-width:960px;margin:0 auto;padding:8px 24px 80px}
/* chain strip */
#strip{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:6px 6px 16px;margin-bottom:20px}
#strip figure{margin:0;flex:0 0 auto;font-size:11px;color:var(--mute)}
#strip img{width:72px;height:96px;object-fit:cover;outline:1px solid var(--line);outline-offset:2px;display:block;margin-bottom:5px}
#strip .arr{color:var(--mute);margin:0 4px 18px}
/* step */
.step{margin-bottom:44px}
.step h2{margin:0;font-size:13px;font-weight:700;display:flex;gap:12px;align-items:baseline}
.step h2 .st{margin-left:auto;font-weight:400;color:var(--accent)}
.step h2+.rule{color:var(--mute);overflow:hidden;white-space:nowrap;margin:0 0 14px;letter-spacing:0}
.top{display:grid;grid-template-columns:160px 24px 160px 1fr;gap:12px;align-items:start}
@media(max-width:720px){.top{grid-template-columns:1fr 1fr}.top .arrow{display:none}.top>div:last-child{grid-column:1/-1}}
.top img,.ph{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;outline:1px solid var(--line);outline-offset:3px;background:transparent}
.arrow{color:var(--mute);text-align:center;padding-top:80px}
.cap{font-size:11px;color:var(--mute);margin-top:9px}
.reads div{margin:1px 0}.reads .l{margin:0 0 4px}
.refl{margin-top:14px}.refl div{margin:2px 0}
.no{color:var(--bad)}
details{margin-top:14px}
summary{cursor:pointer;color:var(--mute);list-style:none}summary::-webkit-details-marker{display:none}
summary:hover{color:var(--ink)}
.why{margin-top:8px;padding-left:12px;border-left:1px solid var(--soft);color:var(--mute)}
.why p{margin:6px 0}.why b{color:var(--ink);font-weight:600}
.chip{margin-right:8px}.chip::before{content:"["}.chip::after{content:"]"}
.keep{color:var(--ok)}.alt{color:var(--bad)}
pre{white-space:pre-wrap;margin:4px 0;font:inherit}
.err{color:var(--bad)}
.empty{color:var(--mute);padding:60px 0}
</style>
</head>
<body>
<header>
  <h1>before_recognition</h1>
  <select id="runs"></select>
  <select id="asset"></select>
  <input id="steps" type="number" min="1" max="20" value="3" title="steps">
  <button id="start">start</button>
  <span id="status">idle</span>
</header>
<main>
  <div id="strip"></div>
  <div id="timeline"><div class="empty">// pick a run</div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else e.setAttribute(k,v)}for(const c of kids.flat())if(c!=null)e.append(c);return e};
const pct=x=>Math.round(x*100)+'%', f2=x=>x.toFixed(2);
let es=null,runId=null,steps={};
const file=f=>`/runs/${runId}/${f}`;

function stripAdd(src,label){
  const s=$('#strip');
  if(s.children.length)s.append(el('span',{class:'arr',text:'->'}));
  s.append(el('figure',{},el('img',{src}),el('div',{text:label})));
}
function ensure(t){
  if(steps[t])return steps[t];
  const s={};
  s.title=el('span',{text:`step ${String(t).padStart(2,'0')}`});
  s.st=el('span',{class:'st'});
  s.inImg=el('img');
  s.outBox=el('div',{},el('div',{class:'ph'}),el('div',{class:'cap',text:'result'}));
  s.reads=el('div',{class:'reads'});
  s.refl=el('div',{class:'refl'});
  s.why=el('div',{class:'why'});
  s.root=el('div',{class:'step'},
    el('h2',{},s.title,s.st),el('div',{class:'rule',text:'='.repeat(120)}),
    el('div',{class:'top'},el('div',{},s.inImg,el('div',{class:'cap',text:'before'})),el('div',{class:'arrow',text:'->'}),s.outBox,el('div',{},s.reads,s.refl)),
    el('details',{},el('summary',{text:'+ why'}),s.why));
  $('#timeline').append(s.root);
  return steps[t]=s;
}
const why=(s,n)=>s.why.append(n);
const list=a=>a.length?a.join('; '):'nothing';

function handle(e){
  const t=e.step, s=t?ensure(t):null;
  switch(e.type){
    case'run_start':$('#status').textContent=`running · ${e.steps} steps`;$('#status').className='live';break;
    case'step_start':s.inImg.src=file(e.input);if(t===1)stripAdd(file(e.input),'original');break;
    case'status':s.st.textContent=e.text;$('#status').textContent=`step ${t} · ${e.text}`;$('#status').className='live';break;
    case'reading':
      s.reads.replaceChildren(el('div',{class:'cap l',text:'reads as'}),el('div',{text:e.identity.label}));
      why(s,el('p',{},el('b',{text:'Evidence: '}),e.identity.evidence));break;
    case'hypothesis':{const o=e.operation;
      s.title.textContent=`step ${String(t).padStart(2,'0')} -- undo ${o.name}`;
      why(s,el('p',{},el('b',{text:'Formed by: '}),e.formation.process));
      why(s,el('p',{text:e.formation.reasoning}));
      why(s,el('p',{},el('b',{text:'Why '+o.name+': '}),o.reasoning));
      why(s,el('p',{},o.preserve.map(x=>el('span',{class:'chip keep',text:x})),o.alter.map(x=>el('span',{class:'chip alt',text:x}))));break}
    case'prompt':why(s,el('p',{},el('b',{text:'Prompt'}),el('pre',{text:e.text})));break;
    case'result':
      s.outBox.replaceChildren(el('img',{src:file(e.file)}),el('div',{class:'cap',text:'result'}));
      stripAdd(file(e.file),`step ${t}`);break;
    case'final':{
      const f=el('div',{class:'step'},el('h2',{},el('span',{text:'final'})),el('div',{class:'rule',text:'='.repeat(120)}),
        el('div',{class:'top'},el('div',{},el('img',{src:file(e.file)})),el('div',{class:'arrow',text:''}),el('div'),
          el('div',{class:'reads'},el('div',{class:'cap l',text:'reads as'}),el('div',{text:e.identity.label}))));
      $('#timeline').append(f);break}
    case'step_end':s.st.textContent='';break;
    case'error':s.root.append(el('div',{class:'err',text:e.text}));break;
    case'run_end':$('#status').textContent='finished';$('#status').className='';break;
  }
}
function open_(id){
  if(es)es.close();
  runId=id;steps={};$('#timeline').replaceChildren();$('#strip').replaceChildren();
  $('#status').textContent='loading…';
  es=new EventSource('/stream/'+id);
  es.onmessage=m=>{try{handle(JSON.parse(m.data))}catch(err){console.error(err)}};
  es.onerror=()=>es.close();
}
async function loadLists(select){
  const runs=await (await fetch('/api/runs')).json();
  const sel=$('#runs');sel.replaceChildren(el('option',{value:'',text:'past runs'}),...runs.map(r=>el('option',{value:r,text:r})));
  if(select)sel.value=select;
  const assets=await (await fetch('/api/assets')).json();
  $('#asset').replaceChildren(...assets.map(a=>el('option',{value:a,text:a})));
}
$('#runs').onchange=e=>e.target.value&&open_(e.target.value);
$('#start').onclick=async()=>{
  const r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({image:$('#asset').value,steps:+$('#steps').value})});
  const j=await r.json();
  if(j.error){alert(j.error);return}
  await loadLists(j.run_id);open_(j.run_id);
};
loadLists().then(()=>{const first=$('#runs').options[1];if(first){$('#runs').value=first.value;open_(first.value)}});
</script>
</body>
</html>
